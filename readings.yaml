# 読み替え辞書。
#
# Irodori-TTS が読みを外しやすい語をカタカナに置き換える。
# ここは一般的な技術用語だけを置く。**固有の名前や手元の事情は
# readings.local.yaml に書くこと。** こちらは公開される前提のファイル。
#
# 書き換えたら管理UIか POST /readings/reload で読み直す。サーバの再起動は要らない。
#
# 当て方の決まり:
#   - 長い語から先に当たる。記述の順番は気にしなくてよい
#   - 英数字で始まる／終わる語には境界が付く。Claude は Claudette に当たらない。
#     「Claudeは」のように日本語が続く場合は当たる
#   - **全部大文字の語は大文字にだけ当たる。** IT の規則が it に当たる事故を防ぐため。
#     それ以外の語は大文字小文字を区別しない（Claude と claude は同じ扱い）

words:
  # --- AI 関連 ---
  Claude Code: クロードコード
  Claude: クロード
  ChatGPT: チャットジーピーティー
  Copilot: コパイロット
  Gemini: ジェミニ
  OpenAI: オープンエーアイ
  AI: エーアイ
  LLM: エルエルエム
  TTS: ティーティーエス
  prompt: プロンプト
  token: トークン

  # --- 開発 ---
  API: エーピーアイ
  CLI: シーエルアイ
  UI: ユーアイ
  URL: ユーアールエル
  HTTP: エイチティーティーピー
  HTTPS: エイチティーティーピーエス
  HTML: エイチティーエムエル
  CSS: シーエスエス
  JSON: ジェイソン
  YAML: ヤムル
  SQL: エスキューエル
  Git: ギット
  GitHub: ギットハブ
  Python: パイソン
  JavaScript: ジャバスクリプト
  TypeScript: タイプスクリプト
  Node.js: ノードジェイエス
  React: リアクト
  Docker: ドッカー
  Linux: リナックス
  Windows: ウィンドウズ
  macOS: マックオーエス
  Android: アンドロイド
  iOS: アイオーエス

  # --- 機械 ---
  CPU: シーピーユー
  GPU: ジーピーユー
  VRAM: ブイラム
  RAM: ラム
  SSD: エスエスディー
  Wi-Fi: ワイファイ
  LAN: ラン

# 記号。読み飛ばされたり、そのままの字で読まれたりするもの。
#
# **読みを空にすると読み飛ばす。** 記号は文脈で意味が変わるので、
# 無理に言葉を当てるより読まないほうが自然なことがある。
#   '→': ' '    読まない（前後は離す）
#   '→': '、'   読まないが、少し間を置く
#   '→': ''     読まないうえ、前後がくっつく
#
# 値を書き忘れてはならない。`'→':` だけだと「None」と読み上げる…
# のは塞いであるが、意図が分からなくなるので空文字を明示すること
symbols:
  # 「から」は「AからB」の形では自然だが、箇条書きの矢印では不自然。
  # 迷ったら読み飛ばす側に倒す
  '→': '、'
  '⇒': '、'
  '％': 'パーセント'
  '%': 'パーセント'
  '※': 'なお、'
  '—': '、'

# 正規表現。語の規則より先に当たる。\1 で括弧の中を参照する。
# \b は日本語に効かない（\w が日本語を含むため「3が」の間に境界ができない）。
# 英数字が隣にないことを見ること
patterns:
  # カッコの中が英語だけなら、カッコごと読み飛ばす。
  # 「AGI（Artificial General Intelligence）」→「AGI」
  #
  # 言い換えの併記なので、落としても意味は失われない。むしろ
  # **英語の長い綴りは Irodori-TTS がほぼ確実に読み違える**（実機で確認）。
  #
  # 中に日本語が1文字でもあれば落とさない。「（AIの話）」を消してはいけない。
  # そのために、中身に許す文字を英数字と記号だけに絞ってある。
  # 英字が1文字も無いものも落とさない（「（2024年）」「（1000）」は読んでよい）。
  #
  # 半角カッコの前の空白も一緒に取る。「汎用人工知能 (AGI)」で
  # 空白だけが残らないようにするため
  - from: ' ?[（(][-A-Za-z0-9 .,:;''’&/+#]*[A-Za-z][-A-Za-z0-9 .,:;''’&/+#]*[）)]'
    to: ''

  # v1.25.3 → バージョン1点25点3
  - from: '(?<![A-Za-z0-9])v(\d+)\.(\d+)\.(\d+)(?![\d.])'
    to: 'バージョン\1点\2点\3'
  - from: '(?<![A-Za-z0-9])v(\d+)\.(\d+)(?![\d.])'
    to: 'バージョン\1点\2'

# 置き換えないが、未知語としても数えない語。
# **耳で聞いて正しく読めると確かめた語だけ**を入れること。
# 推測で入れると、読み違えている語が未知語の一覧から消えて気づけなくなる。
# 例:
#   - OK
ignore: []
